name: Synoptic overview

# Every run starts with a quick check (~30 s) for a new IFS run. The full build
# only runs when the newest complete 00/12 UTC run differs from the one on the
# site, or when forced.
#
# Main trigger: an external scheduler (cron-job.org, a crontab, ...) calls
# workflow_dispatch with force=false every 10 min. GitHub's own schedule is
# often delayed or skipped, so it is only a backup here.
on:
  schedule:
    - cron: "41 */2 * * *"    # backup, every 2 h (UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the site already has the newest IFS run"
        type: boolean
        default: true         # the "Run workflow" button rebuilds; the scheduler sends false
  push:                       # changes to the scripts: always rebuild
    branches: [main]
    paths: ["Scripts/**", "requirements.txt", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time. A check that starts while a build is running waits for it,
# then sees the new run.txt on the site and skips.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      run: ${{ steps.latest.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ECMWF open-data client only
        run: pip install "$(grep -i '^ecmwf-opendata' requirements.txt)"

      - name: Find the newest complete IFS run
        id: latest
        working-directory: Scripts
        run: |
          run=$(python Retrieve_ECMWF_OpenData.py --latest)
          [[ "$run" =~ ^[0-9]{10}$ ]] || { echo "Unexpected output: $run"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Compare with the run on the live site
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.latest.outputs.run }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}          # empty for schedule and push
        run: |
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          live=$(curl -fsS "${site%/}/img/run.txt?nocache=$(date +%s)" 2>/dev/null || echo none)
          echo "Newest IFS run: $LATEST   on the site: $live   trigger: $EVENT   force: ${FORCE:-n/a}"
          if [[ "$EVENT" == "push" || "$FORCE" == "true" || "$LATEST" != "$live" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "### Site is up to date (IFS run $live), nothing to build" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache coastlines and borders (Natural Earth)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v2

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download IFS forecast, DWD charts and meteogram
        working-directory: Scripts
        env:
          IFS_RUN: ${{ needs.check.outputs.run }}   # exactly the run the check found
        run: bash Retrieve_Forecast.bash

      - name: Render maps and build the page
        working-directory: Scripts
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
